<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Викторина «Маленький тест для больших сердец»</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #e8f5e9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 820px;
            width: 100%;
            background: white;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(30, 126, 52, 0.15);
            padding: 32px 28px;
        }
        h1 {
            font-size: 26px;
            font-weight: 700;
            color: #1e3c2a;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            border-bottom: 3px solid #28a745;
            padding-bottom: 18px;
            margin-bottom: 24px;
        }
        h1 small {
            font-size: 15px;
            font-weight: 400;
            color: #5a7a6a;
            margin-left: auto;
        }
        .progress-block {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f0faf2;
            padding: 12px 20px;
            border-radius: 60px;
            margin-bottom: 30px;
            font-weight: 500;
            color: #1e3c2a;
            flex-wrap: wrap;
            gap: 8px;
        }
        .badge {
            background: #28a745;
            color: white;
            padding: 4px 18px;
            border-radius: 40px;
            font-size: 14px;
        }
        .question-header {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #5a7a6a;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .question-text {
            font-size: 22px;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 24px;
            color: #1e3c2a;
        }
        .question-text .emoji-big {
            font-size: 32px;
            margin-right: 12px;
            display: inline-block;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
        }
        .option {
            background: #f8fdf9;
            border: 2px solid #d4edda;
            border-radius: 18px;
            padding: 16px 20px;
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 14px;
            color: #1e3c2a;
        }
        .option:hover:not(.disabled-opt) {
            background: #e8f5e9;
            border-color: #28a745;
            transform: scale(1.01);
        }
        .option .letter {
            background: #d4edda;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            color: #1e7e34;
            flex-shrink: 0;
        }
        .option.correct {
            background: #d4edda;
            border-color: #28a745;
        }
        .option.correct .letter {
            background: #28a745;
            color: white;
        }
        .option.incorrect {
            background: #f8d7da;
            border-color: #dc3545;
        }
        .option.incorrect .letter {
            background: #dc3545;
            color: white;
        }
        .option.disabled-opt {
            cursor: default;
            opacity: 0.85;
        }
        .explanation {
            background: #f0faf2;
            border-left: 6px solid #28a745;
            padding: 16px 20px;
            border-radius: 16px;
            margin: 8px 0 20px;
            font-size: 15px;
            line-height: 1.5;
            color: #1e3c2a;
            display: none;
        }
        .explanation.show {
            display: block;
        }
        .explanation strong {
            color: #1e7e34;
        }
        .nav-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .btn {
            background: #ecf0f1;
            border: none;
            padding: 12px 30px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 16px;
            color: #1e3c2a;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .btn-primary {
            background: #28a745;
            color: white;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.35);
        }
        .btn-primary:hover:not(:disabled) {
            background: #1e7e34;
            transform: translateY(-2px);
        }
        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-secondary:hover {
            background: #d5dbdb;
        }
        .result-screen {
            text-align: center;
            padding: 30px 10px;
        }
        .result-screen .big-score {
            font-size: 72px;
            font-weight: 800;
            color: #28a745;
            line-height: 1;
            margin: 20px 0 10px;
        }
        .result-screen .label-score {
            font-size: 20px;
            color: #5a7a6a;
        }
        .result-screen .message {
            font-size: 20px;
            font-weight: 500;
            margin: 24px 0 18px;
            padding: 20px;
            background: #f0faf2;
            border-radius: 30px;
            color: #1e3c2a;
        }
        .hidden {
            display: none !important;
        }
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 13px;
            color: #8aa99a;
            border-top: 1px solid #d4edda;
            padding-top: 24px;
        }
        .footer a {
            color: #28a745;
            text-decoration: none;
        }
        @media (max-width: 600px) {
            .container {
                padding: 20px 16px;
                border-radius: 24px;
            }
            .question-text {
                font-size: 18px;
            }
            .option {
                font-size: 15px;
                padding: 14px 16px;
            }
            h1 {
                font-size: 20px;
            }
            .progress-block {
                font-size: 14px;
            }
            .btn {
                padding: 10px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <h1>🌿 Викторина <small>Путь к дому</small></h1>
        <div class="progress-block" id="progressBlock">
            <span id="questionCounter">Вопрос 1 / 50</span>
            <span>⭐ Баллы: <strong id="scoreDisplay">0</strong></span>
            <span class="badge" id="roundLabel">Лёгкий</span>
        </div>
        <div id="quizArea">
            <div class="question-header" id="roundHeader">РАУНД 1 · ЛЁГКИЙ</div>
            <div class="question-text" id="questionText">Загрузка вопроса...</div>
            <div class="options" id="optionsContainer"></div>
            <div class="explanation" id="explanationBlock"></div>
            <div class="nav-area">
                <button class="btn btn-secondary" id="prevBtn" disabled>◀ Назад</button>
                <button class="btn btn-primary" id="nextBtn" disabled>Далее ▶</button>
            </div>
        </div>
        <div id="resultScreen" class="result-screen hidden">
            <div style="font-size:48px;">🏁</div>
            <div class="big-score" id="finalScore">0</div>
            <div class="label-score">из 50 баллов</div>
            <div class="message" id="finalMessage">Вы — настоящий друг животных!</div>
            <button class="btn btn-primary" onclick="restartQuiz()" style="margin-top:10px;">🔄 Пройти снова</button>
        </div>
        <div class="footer">🌱 Знание — первый шаг к спасению. ❤️<br />Благотворительный фонд «Дарящие Надежду»</div>
    </div>

    <script>
        // ===== ВСЕ 50 ВОПРОСОВ С ЭМОДЗИ =====
        var QUESTIONS = [
            { round: 1, roundLabel: 'Лёгкий', emoji: '🐕', question: 'Сколько в среднем длится беременность у дворовой собаки?', options: ['2 месяца', '9 месяцев (как у людей)', '1 месяц'], correct: 0, explanation: '✅ Беременность длится 58–68 дней — это примерно 2 месяца.' },
            { round: 1, roundLabel: 'Лёгкий', emoji: '🐱', question: 'Как называют детёныша бездомной кошки?', options: ['Щенок', 'Котёнок', 'Мышонок'], correct: 1, explanation: '✅ Даже если он родился на улице, это котёнок.' },
            { round: 1, roundLabel: 'Лёгкий', emoji: '🐾', question: 'Правда ли, что все бездомные собаки злые и агрессивные?', options: ['Да, они кусаются от злости', 'Нет, агрессия — это страх и защита'], correct: 1, explanation: '✅ Чаще всего агрессия — реакция на стресс и неизвестность.' },
            { round: 1, roundLabel: 'Лёгкий', emoji: '🥛', question: 'Что НЕЛЬЗЯ давать найденному щенку?', options: ['Козье молоко', 'Коровье молоко из магазина', 'Смесь для щенков'], correct: 1, explanation: '✅ У собак и кошек часто непереносимость лактозы, коровье молоко опасно.' },
            { round: 1, roundLabel: 'Лёгкий', emoji: '🐈', question: 'Почему бездомные кошки трутся о ноги прохожих?', options: ['Просят еды', 'Метят человека феромонами', 'Тренируют мышцы'], correct: 1, explanation: '✅ Они оставляют свой запах — жест дружбы и «присвоения».' },
            { round: 1, roundLabel: 'Лёгкий', emoji: '⏳', question: 'Какова средняя продолжительность жизни бездомного животного на улице?', options: ['Около 10 лет', 'Около 3 лет', 'Около 1 года'], correct: 1, explanation: '✅ В среднем бездомные животные живут около 3 лет.' },
            { round: 1, roundLabel: 'Лёгкий', emoji: '🚑', question: 'Что делать, если нашли травмированное животное, но боитесь подойти?', options: ['Позвать по кличке', 'Накинуть куртку', 'Позвонить волонтёрам или в службу'], correct: 2, explanation: '✅ Животное в шоке может укусить. Лучше вызвать профессионалов.' },
            { round: 1, roundLabel: 'Лёгкий', emoji: '🩺', question: 'Можно ли определить стерилизована ли кошка по внешнему виду?', options: ['Да, по надрезу на ухе (клиппинг)', 'Да, у стерилизованных короче хвост', 'Нет, невозможно'], correct: 0, explanation: '✅ В программах ОСВВ ухо метят — это клиппинг.' },
            { round: 1, roundLabel: 'Лёгкий', emoji: '🏠', question: 'Кто чаще оказывается на улице — породистые или беспородные?', options: ['Только беспородные', 'И те, и другие', 'Только породистые'], correct: 1, explanation: '✅ Любое животное может оказаться на улице по вине человека.' },
            { round: 1, roundLabel: 'Лёгкий', emoji: '❓', question: 'Какова основная причина появления новых бездомных животных?', options: ['Миграция из лесов', 'Нестерилизованные питомцы и отказ владельцев', 'Рождаются на улице'], correct: 1, explanation: '✅ Основной источник — домашние животные, которых не стерилизуют или выбрасывают.' },
            { round: 1, roundLabel: 'Лёгкий', emoji: '🇬🇧', question: 'Какая страна — родина современного движения защиты животных?', options: ['Россия', 'Англия', 'США'], correct: 1, explanation: '✅ Первые общества защиты животных появились в Англии в XIX веке.' },
            { round: 1, roundLabel: 'Лёгкий', emoji: '⚖️', question: 'Как по закону в РФ называют животное без владельца?', options: ['Бездомное', 'Ничье', 'Безнадзорное'], correct: 2, explanation: '✅ Юридически точный термин — «животное без владельца» или «безнадзорное».' },
            { round: 1, roundLabel: 'Лёгкий', emoji: '📚', question: 'Зачем волонтёры проводят «Уроки доброты» в школах?', options: ['Чтобы дети приносили корм', 'Чтобы формировать ответственное отношение', 'Чтобы выбирали породистых'], correct: 1, explanation: '✅ Это профилактика жестокости и безответственности с детства.' },
            { round: 1, roundLabel: 'Лёгкий', emoji: '🔄', question: 'Что происходит с животными после ОСВВ?', options: ['Остаются в приюте', 'Усыпляют', 'Возвращают в среду обитания'], correct: 2, explanation: '✅ ОСВВ = Отлов — Стерилизация — Вакцинация — Возврат.' },
            { round: 1, roundLabel: 'Лёгкий', emoji: '💧', question: 'Можно ли поить найденных котят водой из-под крана?', options: ['Да, если отстоялась', 'Да, кипячёной', 'Лучше специальная смесь, молоко нельзя'], correct: 1, explanation: '✅ Вода должна быть кипячёной, коровье молоко категорически запрещено.' },
            { round: 2, roundLabel: 'Средний', emoji: '📜', question: 'В каком веке в России впервые законодательно запретили жестокое обращение с животными?', options: ['XVIII век', 'XIX век (1871)', 'XX век (СССР)'], correct: 1, explanation: '✅ В 1871 году по Уставу о наказаниях — штраф до 10 рублей.' },
            { round: 2, roundLabel: 'Средний', emoji: '🌍', question: 'Какое животное стало символом Международного дня защиты бездомных животных (4 октября)?', options: ['Собака', 'Кошка', 'Слон'], correct: 0, explanation: '✅ 4 октября — день памяти Франциска Ассизского, покровителя животных. Символом дня выбрана собака.' },
            { round: 2, roundLabel: 'Средний', emoji: '🏙️', question: 'Почему в Москве и Питере почти нет бездомных собак?', options: ['Их отстреливают', 'Работает программа ОСВВ', 'Их вывозят за город'], correct: 1, explanation: '✅ Это результат многолетней системной работы по ОСВВ и развитой сети приютов.' },
            { round: 2, roundLabel: 'Средний', emoji: '📊', question: 'Сколько бездомных кошек и собак насчитывалось в России по переписи 2024 года?', options: ['Около 1 млн', 'Около 3,6 млн', 'Около 10 млн'], correct: 1, explanation: '✅ По данным экспертов — около 3,6 млн бездомных животных.' },
            { round: 2, roundLabel: 'Средний', emoji: '😢', question: 'Какой процент владельцев хотя бы раз отказывался от питомца?', options: ['5%', 'Каждый четвёртый', 'Каждый второй'], correct: 1, explanation: '✅ Каждый четвёртый владелец собаки и каждый третий хозяин кошки.' },
            { round: 2, roundLabel: 'Средний', emoji: '🚪', question: 'Что такое «самовыгул» и почему это проблема?', options: ['Прогулка без поводка', 'Свободный выход за пределы двора', 'Разрешённый законом выгул'], correct: 1, explanation: '✅ Это когда питомец свободно уходит со двора и может потеряться или дать потомство.' },
            { round: 2, roundLabel: 'Средний', emoji: '📢', question: 'Какое животное на улице создаёт больше резонанса, по мнению экспертов?', options: ['Кошка', 'Собака', 'Грызуны'], correct: 1, explanation: '✅ Собак видно чаще, они выходят на контакт, хотя кошек статистически больше.' },
            { round: 2, roundLabel: 'Средний', emoji: '🏡', question: 'Сколько приютов для животных насчитывается в России?', options: ['Около 100', 'Около 530', 'Около 2000'], correct: 1, explanation: '✅ Около 530 приютов, где живут примерно 170 тыс. животных.' },
            { round: 2, roundLabel: 'Средний', emoji: '📉', question: 'Сколько процентов россиян берут питомца из приюта?', options: ['30%', '5%', '50%'], correct: 1, explanation: '✅ Только 5% забирают животных из приютов, остальные покупают.' },
            { round: 2, roundLabel: 'Средний', emoji: '🎨', question: 'Что означают разные цвета ошейников у собак в приютах?', options: ['Цвет зависит от настроения', 'Маркировка уровня социализации', 'Указывает на возраст'], correct: 1, explanation: '✅ В приютах используют цветные ошейники: зелёный — дружелюбная, жёлтый — осторожная, красный — нужна дистанция.' },
            { round: 2, roundLabel: 'Средний', emoji: '🧠', question: 'Как называется метод реабилитации собак с использованием собак-наставников?', options: ['Социализация через пример', 'Метод "Наставник"', 'Иммерсионная терапия'], correct: 1, explanation: '✅ Метод "Наставник" — когда к пугливой собаке подселяют спокойную. Дикая собака копирует поведение наставника.' },
            { round: 2, roundLabel: 'Средний', emoji: '🔬', question: 'Какой организм периодически проводит перепись бездомных животных в России?', options: ['Росстат', 'МВД', 'Центр изучения питания и благополучия животных'], correct: 2, explanation: '✅ Это сложное исследование с тройной проверкой данных.' },
            { round: 2, roundLabel: 'Средний', emoji: '🐶', question: 'Какая порода собак считается самой частой "гостьей" в приютах России?', options: ['Овчарка', 'Хаски', 'Дворняжка (метис)'], correct: 2, explanation: '✅ Более 75% собак в приютах — беспородные метисы. Они выносливы, умны, но из-за отсутствия "статуса" их реже забирают.' },
            { round: 2, roundLabel: 'Средний', emoji: '🏷️', question: 'Зачем в дореволюционной Уфе вешали жетон на ошейник собаки?', options: ['Для красоты', 'Для уплаты налога', 'Как талисман'], correct: 1, explanation: '✅ Раз в 5 лет платили налог и получали жетон с номером и надписью «У.Г.У.».' },
            { round: 2, roundLabel: 'Средний', emoji: '⚖️', question: 'В каком случае животное — объект экологического, а не гражданского права?', options: ['Если оно домашнее', 'Если оно в состоянии естественной свободы (дикое)', 'Если в приюте'], correct: 1, explanation: '✅ Состояние естественной свободы — ключевой юридический факт.' },
            { round: 2, roundLabel: 'Средний', emoji: '🗺️', question: 'В каком округе критически низкий уровень стерилизации (около 10%)?', options: ['Центральный', 'Дальневосточный ФО', 'Краснодарский край'], correct: 1, explanation: '✅ Дальневосточный федеральный округ — самый низкий процент стерилизации.' },
            { round: 3, roundLabel: 'Сложный', emoji: '💉', question: 'Почему стерилизация важнее простого кормления бездомных?', options: ['Это дешевле', 'Остановка роста популяции — до 400 000 особей за 7 лет', 'Делает послушнее'], correct: 1, explanation: '✅ Одна нестерилизованная кошка с потомством теоретически даёт до 400 000 особей.' },
            { round: 3, roundLabel: 'Сложный', emoji: '🏠➡️🏙️', question: 'Какой процент бездомных животных когда-то был домашним?', options: ['50%', '98%', '100%'], correct: 2, explanation: '✅ 100% — все они либо родились от бывших домашних, либо были выброшены, либо потерялись.' },
            { round: 3, roundLabel: 'Сложный', emoji: '❌', question: 'Что НЕ является причиной появления бездомных животных?', options: ['Нежелательное потомство', 'Самовыгул', 'Естественная смерть диких животных в городе'], correct: 2, explanation: '✅ Основные причины — только человеческий фактор.' },

            { round: 4, roundLabel: 'Бонус · Дарящие Надежду', emoji: '📦', question: 'Какой объём корма доставил фонд в приюты за годы работы?', options: ['100 тонн', '1 109 260 кг (более 1 000 000 кг)', '10 000 кг'], correct: 1, explanation: '✅ Более 1 миллиона килограммов корма.' }
        ];

        // ===== ЛОГИКА =====
        var currentIndex = 0;
        var score = 0;
        var answered = {};

        var questionText = document.getElementById('questionText');
        var optionsContainer = document.getElementById('optionsContainer');
        var explanationBlock = document.getElementById('explanationBlock');
        var prevBtn = document.getElementById('prevBtn');
        var nextBtn = document.getElementById('nextBtn');
        var questionCounter = document.getElementById('questionCounter');
        var scoreDisplay = document.getElementById('scoreDisplay');
        var roundLabel = document.getElementById('roundLabel');
        var roundHeader = document.getElementById('roundHeader');
        var quizArea = document.getElementById('quizArea');
        var resultScreen = document.getElementById('resultScreen');
        var finalScore = document.getElementById('finalScore');
        var finalMessage = document.getElementById('finalMessage');

        function renderQuestion(index) {
            var q = QUESTIONS[index];
            if (!q) return;

            questionCounter.textContent = 'Вопрос ' + (index + 1) + ' / ' + QUESTIONS.length;
            scoreDisplay.textContent = score;
            roundLabel.textContent = q.roundLabel;
            roundHeader.textContent = 'РАУНД ' + q.round + ' · ' + q.roundLabel.toUpperCase();

            // ВСТАВЛЯЕМ ЭМОДЗИ ПЕРЕД ВОПРОСОМ
            questionText.innerHTML = '<span class="emoji-big">' + q.emoji + '</span> ' + q.question;

            var letters = ['А', 'Б', 'В'];
            var html = '';
            for (var i = 0; i < q.options.length; i++) {
                var cls = 'option';
                if (answered[index] !== undefined) {
                    cls += ' disabled-opt';
                    if (i === q.correct) cls += ' correct';
                    else if (i === answered[index] && i !== q.correct) cls += ' incorrect';
                }
                html += '<div class="' + cls + '" data-optindex="' + i + '" onclick="selectOption(' + index + ',' + i + ')">';
                html += '<span class="letter">' + letters[i] + '</span>';
                html += '<span>' + q.options[i] + '</span>';
                html += '</div>';
            }
            optionsContainer.innerHTML = html;

            if (answered[index] !== undefined) {
                explanationBlock.textContent = q.explanation;
                explanationBlock.className = 'explanation show';
            } else {
                explanationBlock.className = 'explanation';
                explanationBlock.textContent = '';
            }

            prevBtn.disabled = (index === 0);
            nextBtn.disabled = (answered[index] === undefined);

            if (index === QUESTIONS.length - 1 && answered[index] !== undefined) {
                nextBtn.textContent = '🏁 Завершить';
            } else {
                nextBtn.textContent = 'Далее ▶';
            }
        }

        function selectOption(qIndex, optIndex) {
            if (answered[qIndex] !== undefined) return;
            var q = QUESTIONS[qIndex];
            if (optIndex === q.correct) score++;
            answered[qIndex] = optIndex;
            renderQuestion(qIndex);
            if (qIndex === QUESTIONS.length - 1) {
                nextBtn.textContent = '🏁 Завершить';
            }
            nextBtn.disabled = false;
        }

        function nextQuestion() {
            if (nextBtn.disabled) return;
            if (currentIndex === QUESTIONS.length - 1) {
                showResults();
                return;
            }
            if (answered[currentIndex] !== undefined) {
                currentIndex++;
                renderQuestion(currentIndex);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion(currentIndex);
            }
        }

        function showResults() {
            quizArea.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            finalScore.textContent = score;
            var message = '';
            if (score >= 45) message = '🌟 Вы — настоящий эксперт и друг животных! Спасибо за ваши знания!';
            else if (score >= 35) message = '🐕 Отлично! Вы много знаете о проблеме бездомных животных. Продолжайте помогать!';
            else if (score >= 25) message = '🐈 Хороший результат! Теперь вы знаете больше и сможете помочь осознанно.';
            else if (score >= 15) message = '🦮 Неплохо! Но есть ещё много фактов, которые стоит узнать о зоозащите.';
            else message = '🐾 Каждый из нас может спасти жизнь. Начните с малого — стерилизуйте питомца или помогите приюту!';
            finalMessage.textContent = message;
        }

        function restartQuiz() {
            currentIndex = 0;
            score = 0;
            answered = {};
            quizArea.classList.remove('hidden');
            resultScreen.classList.add('hidden');
            renderQuestion(0);
        }

        prevBtn.addEventListener('click', prevQuestion);
        nextBtn.addEventListener('click', nextQuestion);

        // СТАРТ
        renderQuestion(0);
    </script>
</body>
</html>
